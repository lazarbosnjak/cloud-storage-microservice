name: pouch

services:
  auth-service:
    image: auth-service
    container_name: auth-service
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    env_file: ./auth-service/.env
    depends_on:
      postgres-auth-service:
        condition: service_healthy

  user-service:
    image: user-service
    container_name: user-service
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file: ./user-service/.env
    depends_on:
      mongo-user-service:
        condition: service_healthy

  file-service:
    image: file-service
    container_name: file-service
    build:
      context: .
      dockerfile: ./file-service/Dockerfile
    env_file: ./file-service/.env

  sharing-service:
    image: sharing-service
    container_name: sharing-service
    build:
      context: .
      dockerfile: ./sharing-service/Dockerfile
    env_file: ./sharing-service/.env

  notification-service:
    image: notification-service
    container_name: notification-service
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    env_file: ./notification-service/.env

  analytics-service:
    image: analytics-service
    container_name: analytics-service
    build:
      context: .
      dockerfile: ./analytics-service/Dockerfile
    env_file: ./analytics-service/.env

  mongo-user-service:
    image: mongo:9.0
    container_name: mongodb-user-service
    restart: always
    ports:
      - "27017:27017"
    env_file: ./user-service/.env
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - user_mongo_data:/data/db

  postgres-auth-service:
    image: postgres:18
    container_name: postgres-auth-service
    restart: always
    ports:
      - "5433:5432"
    env_file: ./auth-service/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - auth_postgres_data:/var/lib/postgresql

volumes:
  auth_postgres_data:
  user_mongo_data:
