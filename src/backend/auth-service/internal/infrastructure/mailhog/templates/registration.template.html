<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      .wrapper {
        background-color: #fcfcff;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
      }

      .card {
        background-color: #6351d1;
        color: #fcfcff;
        width: 50%;
        padding: 2rem;
        border-radius: 1rem;
      }

      .btn {
        margin: 1rem 0;
        padding: 1rem;
        background-color: #dcfe00;
        color: #050317;
        border-radius: 0.5rem;
        text-decoration: none;
      }

      .btn:hover {
        cursor: pointer;
      }

      h1,
      h2 {
        text-align: center;
      }

      .flex {
        display: flex;
      }
      .flex-center {
        justify-content: center;
      }
      .w-100 {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <h1>pouch</h1>
        <h2>Verify registraion</h2>
        <main>
          <p>Click the following button to verify your registration:</p>
          <div class="flex flex-center w-100">
            <a href="{{.}}" class="btn">Verify</a>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
