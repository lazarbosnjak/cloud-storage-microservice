syntax = "proto3";

package api_gateway;

option go_package = "proto/api_gateway";

import "google/api/annotations.proto";

service ApiGateway {
  rpc Ping (PingRequest) returns (PingReply) {
    option (google.api.http) = {
      get: "/"
    };
  }

  rpc PingUser (PingRequest) returns (PingReply) {
    option (google.api.http) = {
      get: "/user"
    };
  }
}

message PingRequest {}

message PingReply {
  string message = 1;
}
